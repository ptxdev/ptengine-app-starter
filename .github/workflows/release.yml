name: Release

# 脚手架自身的 GitHub Release：推 v* tag 时，从 CHANGELOG.md 抽出对应版本那一段作为说明。
#
# 只在脚手架仓（ptxdev/ptengine-app-starter，GitLab 的 push mirror）上跑：
# 客户 clone 出去的应用仓也会带着这个文件，但那里的 v* tag 是应用自己的发布（见 deploy.yml），
# 不该在客户仓里建 Release，所以用 github.repository 守住。
on:
  push:
    tags: ['v*']
  # 手动补建：workflow 上线前就已推到 GitHub 的 tag（v3.0.0 / v3.2.0 / v3.3.0）没有 Release，
  # 在 Actions 页手动触发一次、填空格分隔的 tag 列表即可补齐；日常发版仍走上面的 tag push。
  workflow_dispatch:
    inputs:
      tags:
        description: '要补建 Release 的 tag，空格分隔'
        required: true
        default: 'v3.0.0 v3.2.0 v3.3.0'

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'ptxdev/ptengine-app-starter'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # tag push 时只处理当前 tag；手动触发时处理输入的列表。
      # CHANGELOG 的版本标题形如 `## [3.3.0] - 2026-09-20`；tag 是 `v3.3.0`。
      # 抽出该标题到下一个 `## [` 之间的内容；抽不到就用一句兜底，不让发布失败。
      - name: 按 tag 建 Release（已存在则更新说明）
        env:
          GH_TOKEN: ${{ github.token }}
          TAGS: ${{ github.event_name == 'workflow_dispatch' && inputs.tags || github.ref_name }}
        run: |
          for TAG in $TAGS; do
            VERSION="${TAG#v}"
            awk -v v="$VERSION" '
              $0 ~ "^## \\[" v "\\]" { on=1; next }
              on && /^## \[/ { exit }
              on { print }
            ' CHANGELOG.md > /tmp/notes.md
            if [ ! -s /tmp/notes.md ]; then
              echo "CHANGELOG.md 里没有 ## [$VERSION] 段落，见文件内兼容矩阵。" > /tmp/notes.md
            fi
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
              gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file /tmp/notes.md
            else
              gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
                --title "$TAG" --notes-file /tmp/notes.md --verify-tag
            fi
            echo "release $TAG done ($(wc -c < /tmp/notes.md) bytes of notes)"
          done
